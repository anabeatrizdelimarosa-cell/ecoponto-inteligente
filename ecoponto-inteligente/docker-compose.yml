services:
  db:
    image: postgres:16
    container_name: ecoponto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecoponto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ecoponto_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  ecoponto_data:
